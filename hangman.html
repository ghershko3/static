<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1A1626">
<title>אות · האתגר היומי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1626;
    --surface:#241E33;
    --surface-2:#2E2740;
    --line:rgba(255,255,255,.07);
    --line-strong:rgba(255,255,255,.14);
    --honey:#F2B441;
    --mint:#58C9A0;
    --rose:#E5738A;
    --text:#F4F1F7;
    --muted:#9A93AD;
    --disp:"Rubik","Heebo",system-ui,"Segoe UI",Arial,sans-serif;
    --body:"Heebo","Rubik",system-ui,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--body);color:var(--text);background:var(--bg);
    min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  #confetti{position:fixed;inset:0;z-index:60;pointer-events:none;}

  .app{
    max-width:480px;margin:0 auto;min-height:100dvh;
    display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 14px);
    opacity:0;animation:fade .5s ease .05s forwards;
  }
  @keyframes fade{to{opacity:1;}}

  /* ---- top bar ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px;}
  .brand{display:flex;align-items:center;gap:9px;}
  .logo{
    width:34px;height:34px;border-radius:9px;background:var(--honey);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-weight:900;font-size:22px;color:#211a10;
    box-shadow:0 4px 14px -4px rgba(242,180,65,.6);
  }
  .brand .name{font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1;}
  .brand .name small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.02em;margin-top:2px;}
  .streak{
    display:flex;align-items:center;gap:6px;background:var(--surface);
    border:1px solid var(--line);border-radius:100px;padding:6px 12px;
    font-family:var(--disp);font-weight:700;font-size:14px;
  }
  .streak .flame{font-size:15px;filter:drop-shadow(0 0 6px rgba(242,180,65,.5));}

  /* ---- meta row ---- */
  .meta{display:flex;align-items:center;justify-content:space-between;
    color:var(--muted);font-size:12.5px;padding:0 2px 14px;}
  .meta .cat{color:var(--text);font-weight:500;}
  .meta .cat b{color:var(--honey);font-weight:700;}
  .puzzle-no{font-family:var(--disp);font-weight:500;letter-spacing:.02em;direction:ltr;}

  /* ---- gallows ---- */
  .gallows-wrap{
    background:linear-gradient(180deg,var(--surface),var(--bg));
    border:1px solid var(--line);border-radius:20px;
    padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  svg.gallows{width:100%;max-width:230px;height:auto;display:block;}
  .gallows line, .gallows path, .gallows circle{stroke-linecap:round;}
  .beam{stroke:var(--muted);}
  .figure *{stroke:var(--text);opacity:0;transition:opacity .45s ease;}
  .figure .on{opacity:1;}
  .lives{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
  .lives b{color:var(--text);font-family:var(--disp);font-weight:700;}
  .lives .hearts{display:flex;gap:4px;direction:ltr;}
  .lives .h{width:8px;height:8px;border-radius:50%;background:var(--mint);transition:.3s;}
  .lives .h.lost{background:rgba(255,255,255,.13);transform:scale(.7);}

  /* ---- word ---- */
  .board{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:20px 0 14px;}
  .toast{min-height:20px;text-align:center;font-size:14px;font-weight:500;
    color:var(--muted);opacity:0;transition:opacity .25s;}
  .toast.show{opacity:1;}
  .toast.good{color:var(--mint);}
  .toast.bad{color:var(--rose);}
  .word-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;direction:rtl;}
  .word{display:flex;gap:6px;}
  .tile{
    width:38px;height:50px;border-radius:10px;
    background:var(--surface);border:1px solid var(--line);
    border-bottom:3px solid var(--line-strong);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-weight:800;font-size:28px;color:var(--text);
  }
  .tile.filled{border-bottom-color:var(--mint);background:var(--surface-2);
    animation:pop .4s cubic-bezier(.2,1.4,.4,1) both;}
  .tile.hintfill{border-bottom-color:var(--honey);}
  @keyframes pop{0%{transform:translateY(6px) scale(.9);opacity:0;}100%{transform:none;opacity:1;}}

  /* ---- controls ---- */
  .controls{display:flex;flex-direction:column;gap:12px;}
  .hint-btn{
    align-self:center;display:inline-flex;align-items:center;gap:7px;
    background:var(--surface);border:1px solid var(--line-strong);color:var(--text);
    font-family:var(--disp);font-weight:600;font-size:13px;padding:9px 16px;border-radius:100px;
    cursor:pointer;transition:transform .08s,border-color .2s,opacity .2s;touch-action:manipulation;
  }
  .hint-btn:active{transform:scale(.95);}
  .hint-btn:disabled{opacity:.4;cursor:default;}
  .hint-btn .b{color:var(--honey);}
  .keyboard{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;}
  .key{
    appearance:none;border:none;border-radius:11px;
    background:var(--surface-2);color:var(--text);
    font-family:var(--disp);font-weight:700;font-size:22px;
    height:48px;cursor:pointer;touch-action:manipulation;
    box-shadow:0 2px 0 rgba(0,0,0,.25);
    transition:transform .07s,background .2s,color .2s,box-shadow .1s,opacity .3s;
  }
  .key:active{transform:translateY(2px);box-shadow:none;}
  .key:focus-visible{outline:2px solid var(--honey);outline-offset:2px;}
  .key.hit{background:var(--mint);color:#0d2a20;box-shadow:0 2px 0 #2f7a5e;pointer-events:none;}
  .key.miss{background:transparent;color:var(--muted);box-shadow:none;opacity:.4;pointer-events:none;}

  /* ---- reveal ---- */
  .reveal{
    position:fixed;inset:0;z-index:50;
    background:radial-gradient(130% 90% at 50% 0%, #2E2740 0%, var(--bg) 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:calc(env(safe-area-inset-top) + 26px) 18px calc(env(safe-area-inset-bottom) + 26px);
    overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .6s;
  }
  .reveal.on{opacity:1;visibility:visible;}
  .reveal-inner{max-width:460px;width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;
    transform:translateY(22px);transition:transform .7s cubic-bezier(.2,.7,.2,1);}
  .reveal.on .reveal-inner{transform:none;}
  .reveal .kicker{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.14em;
    color:var(--honey);text-transform:uppercase;direction:ltr;}
  .big-message{font-family:var(--disp);font-weight:900;line-height:.98;
    font-size:clamp(46px,17vw,80px);
    background:linear-gradient(180deg,#fff,var(--honey));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .photo-frame{width:100%;border-radius:20px;overflow:hidden;position:relative;
    border:1px solid var(--line-strong);
    box-shadow:0 30px 60px -30px rgba(0,0,0,.9), 0 0 0 5px rgba(242,180,65,.08);}
  .photo-frame img{display:block;width:100%;height:auto;}
  .sub-message{font-size:16.5px;line-height:1.75;color:var(--muted);max-width:32ch;}
  .sub-message b{color:var(--text);font-weight:700;}
  .replay{margin-top:2px;appearance:none;border:1px solid var(--line-strong);background:transparent;
    color:var(--muted);font-family:var(--disp);font-weight:600;font-size:13px;
    padding:11px 22px;border-radius:100px;cursor:pointer;transition:.2s;}
  .replay:active{transform:scale(.96);}

  @media (max-width:360px){
    .tile{width:33px;height:44px;font-size:24px;}
    .key{height:44px;font-size:20px;}
    svg.gallows{max-width:190px;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

    <p class="sub-message">
      <b>יאללה תארזי</b><br>
      להנמיך ציפיות, אין פה מטוס<br>
      אבל נראה לי לא יזיק לך חופש<br>
      תודהההה ❤️
    </p>
    <button class="replay" id="replay">התחלה מחדש</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  const ANSWER = "תארזי ליומיים";
  const LETTERS = ["א","ב","ג","ד","ה","ו","ז","ח","ט","י","כ","ל","מ","נ","ס","ע","פ","צ","ק","ר","ש","ת"];
  const FINALS = {"ך":"כ","ם":"מ","ן":"נ","ף":"פ","ץ":"צ"};
  const base = ch => FINALS[ch] || ch;
  const MAX_MISS = 6;
  const START_HINTS = 2;

  let guessed=new Set(), miss=0, hints=START_HINTS, done=false;

  const wordRow=document.getElementById("wordRow");
  const keyboard=document.getElementById("keyboard");
  const toast=document.getElementById("toast");
  const livesNum=document.getElementById("livesNum");
  const heartsEl=document.getElementById("hearts");
  const hintBtn=document.getElementById("hintBtn");
  const hintCount=document.getElementById("hintCount");
  const reveal=document.getElementById("reveal");
  const parts=["p1","p2","p3","p4","p5","p6"].map(id=>document.getElementById(id));

  /* hearts */
  for(let i=0;i<MAX_MISS;i++){const s=document.createElement("span");s.className="h";heartsEl.appendChild(s);}
  const hearts=Array.from(heartsEl.children);

  /* tiles */
  ANSWER.split(" ").forEach(word=>{
    const w=document.createElement("div");w.className="word";
    word.split("").forEach(ch=>{
      const t=document.createElement("div");t.className="tile";
      t.dataset.base=base(ch);t.dataset.char=ch;
      w.appendChild(t);
    });
    wordRow.appendChild(w);
  });
  const tiles=Array.from(document.querySelectorAll(".tile"));
  const REQUIRED=[...new Set(tiles.map(t=>t.dataset.base))];
  const isSolved=()=>REQUIRED.every(l=>guessed.has(l));

  /* keyboard */
  const keyEls={};
  LETTERS.forEach(l=>{
    const b=document.createElement("button");
    b.className="key";b.textContent=l;b.setAttribute("aria-label","נחשי "+l);
    b.addEventListener("click",()=>guess(l));
    keyboard.appendChild(b);keyEls[l]=b;
  });

  function say(msg,type){
    toast.textContent=msg;toast.className="toast show"+(type?" "+type:"");
  }
  function updateLives(){
    livesNum.textContent=MAX_MISS-miss;
    hearts.forEach((h,i)=>h.classList.toggle("lost",i>=MAX_MISS-miss));
    parts.forEach((p,i)=>p.classList.toggle("on",i<miss));
  }

  function revealTiles(letter,fromHint){
    const hits=tiles.filter(t=>t.dataset.base===letter && !t.textContent);
    hits.forEach((t,i)=>setTimeout(()=>{
      t.textContent=t.dataset.char;
      t.classList.add("filled");
      if(fromHint)t.classList.add("hintfill");
    },i*80));
    return hits.length;
  }

  function guess(letter){
    if(done||guessed.has(letter))return;
    guessed.add(letter);
    const key=keyEls[letter];
    const n=revealTiles(letter,false);
    if(n){
      key.classList.add("hit");
      say("יש!","good");
      if(isSolved()){done=true;setTimeout(win,n*80+300);}
    }else{
      key.classList.add("miss");
      miss++;updateLives();
      say(MAX_MISS-miss>0?`לא. נותרו ${MAX_MISS-miss} ניסיונות.`:"אוי…","bad");
      if(miss>=MAX_MISS){done=true;setTimeout(lose,600);}
    }
  }

  hintBtn.addEventListener("click",()=>{
    if(done||hints<=0)return;
    const pool=REQUIRED.filter(l=>!guessed.has(l));
    if(!pool.length)return;
    const pick=pool[Math.floor(Math.random()*pool.length)];
    guessed.add(pick);
    keyEls[pick].classList.add("hit");
    revealTiles(pick,true);
    hints--;hintCount.textContent=`(${hints})`;
    if(hints<=0)hintBtn.disabled=true;
    say("הנה אות במתנה 💛","good");
    if(isSolved()){done=true;setTimeout(win,400);}
  });

  function win(){reveal.classList.add("on");confetti.celebrate();}

  function lose(){
    say("נגמרו הניסיונות. עוד סיבוב?","bad");
    setTimeout(reset,1900);
  }

  function reset(){
    guessed=new Set();miss=0;hints=START_HINTS;done=false;
    tiles.forEach(t=>{t.textContent="";t.classList.remove("filled","hintfill");});
    Object.values(keyEls).forEach(k=>k.classList.remove("hit","miss"));
    hintBtn.disabled=false;hintCount.textContent=`(${hints})`;
    toast.className="toast";updateLives();reveal.classList.remove("on");
  }

  document.getElementById("replay").addEventListener("click",reset);
  window.addEventListener("keydown",e=>{const b=base(e.key);if(LETTERS.includes(b))guess(b);});

  updateLives();

  /* confetti */
  const confetti=(function(){
    const cv=document.getElementById("confetti"),ctx=cv.getContext("2d");
    let W,H,ps=[],raf=null;
    const COLORS=["#F2B441","#58C9A0","#E5738A","#F4F1F7","#B79CF0"];
    function resize(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;
      cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";}
    addEventListener("resize",resize);resize();
    function spawn(n){for(let i=0;i<n;i++){const L=Math.random()<.5;
      ps.push({x:(L?0:W),y:H*0.5+Math.random()*H*0.5,
        vx:(L?1:-1)*(6+Math.random()*7)*devicePixelRatio,vy:-(11+Math.random()*8)*devicePixelRatio,
        g:0.28*devicePixelRatio,size:(5+Math.random()*7)*devicePixelRatio,
        color:COLORS[Math.floor(Math.random()*COLORS.length)],rot:Math.random()*6.28,
        vr:(Math.random()-.5)*.4,shape:Math.random()<.5?"r":"c",life:1});}}
    function loop(){ctx.clearRect(0,0,W,H);
      ps.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;if(p.y>H*.55)p.life-=.008;
        ctx.save();ctx.globalAlpha=Math.max(p.life,0);ctx.translate(p.x,p.y);ctx.rotate(p.rot);
        ctx.fillStyle=p.color;
        if(p.shape==="r")ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);
        else{ctx.beginPath();ctx.arc(0,0,p.size/2,0,6.28);ctx.fill();}ctx.restore();});
      ps=ps.filter(p=>p.life>0&&p.y<H+60*devicePixelRatio);
      if(ps.length)raf=requestAnimationFrame(loop);else{cancelAnimationFrame(raf);raf=null;ctx.clearRect(0,0,W,H);}}
    function celebrate(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
      spawn(140);setTimeout(()=>spawn(90),350);setTimeout(()=>spawn(90),750);if(!raf)loop();}
    return{celebrate};
  })();
})();
</script>
